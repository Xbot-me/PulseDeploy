name: CI - Lint & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck - Bash Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Lint entry points
        run: shellcheck -x bootstrap.sh revert.sh crm.sh loadtest/run.sh loadtest/seed/seed.sh

      - name: Lint library, module and test scripts
        run: |
          find scripts/ tests/ -name "*.sh" | xargs shellcheck -x
          shellcheck -x bin/pulse bin/pulse-bench bin/pulse-lt

  loadtest:
    name: Load-test module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Locust
        run: pip install -r loadtest/requirements.txt

      - name: Behaviour-model and engine tests (real Locust against a mock CRM)
        run: LT_SLOW_TESTS=1 python3 -m unittest discover -s loadtest/tests -p 'test_*.py'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx (used to validate rendered configs)
        run: sudo apt-get install -y nginx

      - name: Run unit tests
        run: bash tests/run.sh

  validate-configs:
    name: Validate Config Templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nginx
        run: sudo apt-get install -y nginx

      - name: Validate Nginx config template
        run: |
          # Replace PHP-FPM socket placeholder before testing
          sed 's|PHP_FPM_SOCK|/var/run/php/php8.2-fpm.sock|g' \
            config/nginx/default.conf > /tmp/nginx-test.conf
          # Disable default site to avoid conflicts
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo cp /tmp/nginx-test.conf /etc/nginx/conf.d/test.conf
          sudo nginx -t
          echo "✔ Nginx config template is valid"

      - name: Validate Apache vhost template
        run: |
          sudo apt-get install -y apache2 -qq
          sudo a2enmod headers expires deflate rewrite -q
          sudo cp config/apache/vhost.conf /etc/apache2/sites-available/test.conf
          sudo a2dissite 000-default.conf 2>/dev/null || true
          sudo a2ensite test.conf
          sudo apache2ctl configtest
          echo "✔ Apache vhost template is valid"

  structure-check:
    name: Repo Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          required_files=(
            "bootstrap.sh"
            "README.md"
            "scripts/os/ubuntu.sh"
            "scripts/os/debian.sh"
            "scripts/os/amazon_linux.sh"
            "scripts/os/centos_rocky.sh"
            "revert.sh"
            "tests/run.sh"
            "scripts/lib/common.sh"
            "scripts/lib/web.sh"
            "scripts/lib/profile_tuning.sh"
            "scripts/stacks/laravel_next.sh"
            "bin/pulse"
            "bin/pulse-bench"
            "bin/pulse-lt"
            "loadtest/builder.py"
            "crm.sh"
            "scripts/lib/crm.sh"
            "apps/crm/aventech.conf"
            "config/laravel-next/nginx-api.conf"
            "config/laravel-next/nginx-next.conf"
            "config/laravel-next/nginx-http.conf"
            "config/laravel-next/mysql-tuning.cnf"
            "config/laravel-next/php-fpm-pool.conf"
            "scripts/services/mysql.sh"
            "scripts/stacks/lemp.sh"
            "scripts/stacks/lamp.sh"
            "scripts/stacks/node.sh"
            "scripts/services/firewall.sh"
            "scripts/services/redis.sh"
            "scripts/services/docker.sh"
            "scripts/services/certbot.sh"
            "scripts/services/swap.sh"
            "scripts/services/php_tune.sh"
            "config/nginx/default.conf"
            "config/apache/vhost.conf"
          )
          for f in "${required_files[@]}"; do
            [[ -f "$f" ]] || { echo "MISSING: $f"; exit 1; }
            echo "✔ $f"
          done

      - name: Ensure scripts are executable
        run: |
          chmod +x bootstrap.sh scripts/**/*.sh
          echo "✔ All scripts are executable"