; Managed by PulseDeploy - Laravel pool. "ondemand" keeps idle RAM near zero:
; workers start on the first request and exit after 20 s without work.
[pulse-laravel]
user = @APP_USER@
group = @APP_USER@
listen = @PHP_SOCK@
listen.owner = @WEB_USER@
listen.group = @WEB_USER@
listen.mode = 0660
pm = ondemand
pm.max_children = @CHILDREN@
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 65s
catch_workers_output = yes
security.limit_extensions = .php
