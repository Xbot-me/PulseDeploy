# Managed by PulseDeploy (Laravel + Next.js profile) - http-level settings

map $http_upgrade $pulse_connection_upgrade {
    default upgrade;
    ''      '';
}

# Brute-force protection for authentication endpoints (per client IP)
limit_req_zone $binary_remote_addr zone=pulse_auth:10m rate=30r/m;
limit_req_status 429;

# Cache for optimised storefront images
proxy_cache_path /var/cache/nginx/pulse_shop levels=1:2 keys_zone=pulse_shop:10m
                 max_size=256m inactive=7d use_temp_path=off;

# Requests for unknown host names (bots scanning the IP) get nothing
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
