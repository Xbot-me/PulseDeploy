# Managed by PulseDeploy - Next.js app "@NAME@" (@SERVER_NAMES@)
# Lines starting with "#shop# " / "#admin# " are enabled for that app only,
# "#storage# " lines when --serve-storage is used.
upstream pulse_@NAME@ {
    server 127.0.0.1:@PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name @SERVER_NAMES@;
    server_tokens off;
    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain text/xml
               application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#admin# add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/pulse-@NAME@.access.log pulse_timed;
    error_log  /var/log/nginx/pulse-@NAME@.error.log warn;

    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Build output has content hashes in its names: cache forever, skip Node.
    location /_next/static/ {
        alias /var/www/@NAME@/current/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

#storage# # Uploaded files live in the Laravel public disk; serve them straight from disk
#storage# location /storage/ {
#storage#     alias @STORAGE_DIR@/;
#storage#     expires 30d;
#storage#     access_log off;
#storage#     add_header Cache-Control "public";
#storage#     add_header X-Content-Type-Options "nosniff" always;
#storage#     try_files $uri =404;
#storage# }

#shop# location /_next/image {
#shop#     proxy_pass http://pulse_@NAME@;
#shop#     proxy_http_version 1.1;
#shop#     proxy_set_header Connection "";
#shop#     proxy_set_header Host $host;
#shop#     proxy_cache pulse_shop;
#shop#     proxy_cache_key "$scheme$host$request_uri";
#shop#     proxy_cache_valid 200 30d;
#shop#     proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
#shop#     add_header X-Cache-Status $upstream_cache_status;
#shop# }

    location / {
        proxy_pass http://pulse_@NAME@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pulse_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
    }
}
