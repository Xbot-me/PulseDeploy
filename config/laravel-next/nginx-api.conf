# Managed by PulseDeploy - Laravel API (@HOST@)
server {
    listen 80;
    listen [::]:80;
    server_name @HOST@;

    root @ROOT@;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain text/xml
               application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/pulse-api.access.log;
    error_log  /var/log/nginx/pulse-api.error.log warn;

    # Dotfiles (.env, .git, ...) except ACME challenges
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Throttle credential endpoints
    location ~ ^/(api/)?(login|register|forgot-password|reset-password|sanctum/token)/?$ {
        limit_req zone=pulse_auth burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:@PHP_SOCK@;
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|webp|avif|woff2?|css|js)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # $realpath_root resolves the "current" symlink, so OPcache and PHP
        # see the release directory and a deploy switches over atomically.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:@PHP_SOCK@;
        fastcgi_read_timeout 60;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
