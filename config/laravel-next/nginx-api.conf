# Managed by PulseDeploy - Laravel API (@HOST@)

# Public entry point
server {
    listen 80;
    listen [::]:80;
    server_name @HOST@;

    root @ROOT@;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64M;

    access_log /var/log/nginx/pulse-api.access.log;
    error_log  /var/log/nginx/pulse-api.error.log warn;

    # Throttle credential endpoints (/login, /api/login, /api/v1/admin/login, ...)
    location ~ ^/(api/)?(v[0-9]+/)?([a-z-]+/)?(login|register|forgot-password|reset-password|sanctum/token)/?$ {
        limit_req zone=pulse_auth burst=10 nodelay;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:@PHP_SOCK@;
    }

    include @LOCATIONS@;
}

# Loopback-only entry point for the Next.js apps' server-side calls: no TLS,
# no Cloudflare round trip, no rate limit (only this machine can reach it).
server {
    listen 127.0.0.1:@INTERNAL_PORT@;
    server_name _;

    root @ROOT@;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64M;

    access_log off;
    error_log  /var/log/nginx/pulse-api.error.log warn;

    include @LOCATIONS@;
}
