# AvenTech CRM: Laravel 11 API (backend/) + Next.js admin (admin-frontend/), one
# MySQL database per store selected by the X-Store-Subdomain header.
NAME=AvenTech CRM
REPO=https://github.com/Xbot-me/AvenTech-CRM.git
REF=master
BACKEND_DIR=backend
ADMIN_DIR=admin-frontend

# Database names from the repository's .env.example, plus the per-store pattern
DB_NAME=zymerce_crm
DB_USER=zymerce
TENANT_DB_PREFIX=zymerce_tenant_

# Extra server options: uploads served by nginx, no queue worker (the app has no queued jobs).
# The scheduler stays on: the CRM schedules its own cleanup commands.
SERVER_OPT+=--serve-storage
SERVER_OPT+=--no-queue

# Settings the app needs beyond what the installer writes
BACKEND_ENV+=FRONTEND_URL={ADMIN_URL}
BACKEND_ENV+=STOREFRONT_URL={SHOP_URL}
BACKEND_ENV+=SSLCOMMERZ_STUB=true

# Admin: NEXT_PUBLIC_* are compiled in; the server-side URLs use the loopback API
ADMIN_BUILD_ENV+=NEXT_PUBLIC_DEFAULT_SUBDOMAIN={STORE}
ADMIN_BUILD_ENV+=NEXT_PUBLIC_APP_NAME={APP_NAME}
ADMIN_RUNTIME_ENV+=BACKEND_API_URL={INTERNAL_API_URL}/api/v1/admin
ADMIN_RUNTIME_ENV+=BACKEND_BASE_URL={INTERNAL_API_URL}/api

# First store: one artisan argument per line, run inside the API release
STORE_ARG+=store:create
STORE_ARG+={STORE_NAME}
STORE_ARG+={STORE}
STORE_ARG+=--email={ADMIN_EMAIL}
STORE_ARG+=--password={ADMIN_PASSWORD}
STORE_EXISTS_TEXT=already provisioned

# Smoke tests: a real read of the tenant database, then log in through the admin host (path served by the admin app)
SMOKE_INFO_PATH=/api/v1/storefront/web-info
# 1 once the store is created by a command that sets the store name (store:provision)
SMOKE_STORE_NAME=0
ADMIN_LOGIN_PATH=/api/auth/login
ADMIN_LOGIN_HEADER=X-Store-Subdomain: {STORE}
