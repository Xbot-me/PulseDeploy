# AvenTech gadget-shop storefront (Next.js 16), kept in the CRM repository under storefront/.
# One build serves one store: the store slug is compiled in, so a second client needs its own
# install (or its own build) with its own --store.
NAME=AvenTech Gadgets
REPO=https://github.com/Xbot-me/AvenTech-CRM.git
REF=master
DIR=storefront
BUILD_CMD=npm ci --no-audit --no-fund && npm run build

# Compiled in. NEXT_PUBLIC_API_URL is used by the browser AND by the Next rewrites that proxy
# /api and /storage to the backend, so it must be the public API address.
BUILD_ENV+=NEXT_PUBLIC_TENANT_SUBDOMAIN={STORE}
BUILD_ENV+=NEXT_PUBLIC_API_URL={API_URL}/api
